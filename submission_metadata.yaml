methodology_summary: >
  Deterministic 5-pillar scoring pipeline: skill fit (30%), experience (25%),
  Redrob behavioral signals (25%), education (10%), logistics (10%).
  Features extracted offline with fuzzy skill matching and career description
  semantic scanning. Hard disqualifier gate filters consulting-only careers,
  insufficient experience, and zero must-have skill matches. Honeypot detection
  via multi-signal inconsistency flagging. Template-based reasoning generation
  referencing actual candidate data. No API calls during ranking step.
  Designed to surface candidates with production ML/retrieval work
  regardless of keyword matching.
